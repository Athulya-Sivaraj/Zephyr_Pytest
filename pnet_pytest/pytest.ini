[pytest]
testpaths = tests
pythonpath = .
# The pnet session fixture keeps one UART session for the whole run.
addopts = --dut-scope=session -ra
log_cli = true
log_cli_level = INFO
log_file = pnet_run.log
log_file_level = DEBUG
junit_family = xunit2

markers =
    smoke: fast bring-up checks, run on every build
    functional: feature behaviour (Wi-Fi, DNS, TCP, UDP, MQTT, multi-socket)
    power: power-save behaviour
    power_meas: current measurement (needs PPK2)
    perf: zperf / iperf throughput
    negative: invalid input and error paths
    recovery: link / AP / peer / NCP recovery
    concurrency: overlapping operations
    stress: high-iteration loops (minutes)
    soak: long runs (hours); opt in with -m soak
    fw_runner: firmware built-in test_run / test_run_all
    disruptive: resets or faults the board; runs last
    scope_id(id): link to the scope workbook id; known_issues.yaml keys use it
    requires(*caps): skip unless the testbed provides these capabilities
